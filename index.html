<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithm Visualizer</title>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('av-theme');
          var theme = saved || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-full flex flex-col paper-canvas relative">
    <!-- Precision Grid Cell Illuminator Canvas -->
    <canvas id="gridCanvas" class="fixed inset-0 pointer-events-none z-0" aria-hidden="true"></canvas>

    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/grid-effect.js"></script>
  </body>
</html>
